# OpenVRPatch settings for EyeTrackingGuide. Place next to EyeTrackingGuide.exe.
# All keys are optional; these are the defaults.

# Unity stores Direct3D render textures bottom-up. If the image in the headset is upside down, set false.
flip_v = true

# Colour space of the eye textures as reported to SteamVR: gamma, linear or auto.
# If the scene looks washed out or too dark, try the other values.
color_space = gamma

# Treat a trigger click as A/X, so the menus work whatever your controller bindings are.
trigger_as_a = true

# Multiplier on SteamVR's recommended render resolution (the patch already widens it to cover the
# symmetric frustum the app renders). Lower this if the app runs below the headset refresh rate.
resolution_scale = 1.0

# Extra frames of pose prediction. Raise to 2 if head motion looks laggy, lower to 0 if it overshoots.
prediction_frames = 1
